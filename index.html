<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

<div class="app-container">
    <div class="search-header">
        <div class="school-tag">國立臺南大學 NUTN</div>
        <h2>Maomi Chinese Dictionary</h2>
        
        <div class="tab-box" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;">
            <button id="tab-dict" class="tab-btn active" onclick="switchTab('dict')">📖 Từ Điển</button>
            <button id="tab-speak" class="tab-btn" onclick="switchTab('speak')">🗣️ Hội Thoại</button>
        </div>

      <div id="search-section-dict" class="search-box">
            <input type="text" id="searchInput" placeholder="Tra từ: 請問，你好，..." onkeyup="searchDict()">
            <button>🔍</button>
        </div>

        <div id="search-section-speak" class="search-box" style="display: none;">
            <input type="text" id="dialogueSearchInput" placeholder="Tìm hội thoại: Bài 1, Mời đồ uống, Chào hỏi..." onkeyup="searchDialogue()">
            <button>🔍</button>
        </div>
        <div id="dialogue-search-section" class="search-box" style="display: none;">
            <input type="text" id="dialogueSearchInput" placeholder="Tìm hội thoại: Bài 1, Mời đồ uống, xin chào..." onkeyup="searchDialogue()">
            <button>🔍</button>
        </div>
    </div>

    <div id="dictionary-container" class="result-area"></div>
    
    <div id="dialogue-container" class="result-area" style="display: none;"></div>
</div>
