<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maomi Dictionary - NUTN</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body>
<!-- KHU VỰC ĐĂNG NHẬP DÀNH CHO SINH VIÊN -->
    <div id="login-section" style="text-align: center; padding-top: 100px; font-family: Arial, sans-serif;">
        <h2 style="color: #d84b6b;">🎓 Maomi Cidian - Maomi Chinese Dictionary</h2>
        <p>Vui lòng đăng nhập để lưu tiến độ ôn luyện TOCFL của bạn.</p>
        <input type="text" id="email-input" placeholder="Tài khoản học sinh (Email)..." style="padding: 10px; width: 250px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;"><br>
        <input type="password" id="password-input" placeholder="Mật khẩu..." style="padding: 10px; width: 250px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;"><br>
        <button onclick="loginStudent()" style="padding: 10px 20px; background-color: #d84b6b; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;">Đăng Nhập</button>
        <p id="login-error" style="color: red; margin-top: 10px;"></p>
    </div>
    <div id="main-dictionary-app" class="app-container" style="display: none;">
        <div class="search-header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="school-tag" style="margin: 0;">國立臺南大學 NUTN</div>
                <button onclick="logoutStudent()" style="background-color: #666; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 14px;">Đăng xuất 👋</button>
            </div>
            <h2>Maomi Chinese Dictionary</h2>

            <div class="modern-search-box" id="search-section-dict">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Tra từ: 請問，你好..." onkeyup="searchDict()">
            </div>
            
            <div class="modern-search-box" id="search-section-speak" style="display: none;">
                <span class="search-icon">🔍</span>
                <input type="text" id="dialogueSearchInput" placeholder="Tìm hội thoại..." onkeyup="searchDialogue()">
            </div>

            <div class="modern-filters">
                <button id="tab-dict" class="filter-btn active" onclick="switchTab('dict')">📖 Từ Điển</button>
                <button id="tab-speak" class="filter-btn" onclick="switchTab('speak')">🗣️ Hội Thoại</button>
            </div>
        </div>

        <div id="dictionary-container" class="result-area"></div>
        <div id="dialogue-container" class="result-area" style="display: none;"></div>
    </div>
<!-- Tải thư viện Firebase cốt lõi -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<!-- Tải thư viện Xác thực (Đăng nhập) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<!-- Tải thư viện Cơ sở dữ liệu (Lưu điểm số, hành vi) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
